<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 990" width="1400" height="990" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 z" fill="#111"/>
    </marker>
    <style>
      .vis{fill:none;stroke:#111;stroke-width:2.4;stroke-linejoin:round}
      .thin{fill:none;stroke:#111;stroke-width:1}
      .hid{fill:none;stroke:#111;stroke-width:1.2;stroke-dasharray:7 4}
      .hidt{fill:none;stroke:#111;stroke-width:0.8;stroke-dasharray:7 4}
      .ctr{fill:none;stroke:#555;stroke-width:0.9;stroke-dasharray:22 4 3 4}
      .dim{fill:none;stroke:#111;stroke-width:0.9}
      .dima{fill:none;stroke:#111;stroke-width:0.9;marker-start:url(#arr);marker-end:url(#arr)}
      .lead{fill:none;stroke:#111;stroke-width:0.9;marker-start:url(#arr)}
      .grid{fill:none;stroke:#111;stroke-width:1}
      .t{font-size:14px;fill:#111}
      .tb{font-size:14px;font-weight:700;fill:#111}
      .ts{font-size:12px;fill:#333}
      .tn{font-size:13px;fill:#111}
      .tl{font-size:10px;fill:#555;letter-spacing:.4px}
      .h{font-size:18px;font-weight:700;fill:#111;letter-spacing:.5px}
      .q{fill:#c2410c}
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="990" fill="#fff"/>
  <rect x="20" y="20" width="1360" height="950" class="grid" stroke-width="1.6"/>

  <!-- ================= ÜSTTEN GÖRÜNÜM ================= -->
  <g transform="translate(40,0)">
    <!-- eksenler -->
    <line class="ctr" x1="150" y1="420" x2="677" y2="420"/>
    <line class="ctr" x1="380" y1="160" x2="380" y2="600"/>

    <!-- gövde (conta oturma yüzeyi) -->
    <circle class="vis" cx="380" cy="420" r="150"/>
    <!-- üst uç 1 1/2" dış diş: diş üstü kalın, diş dibi 3/4 ince yay -->
    <circle class="vis" cx="380" cy="420" r="119.5"/>
    <path class="thin" d="M380 308 A112 112 0 1 0 492 420"/>
    <!-- boydan boya delik -->
    <circle class="vis" cx="380" cy="420" r="95"/>

    <!-- P1: 3/4" iç diş (üst) -->
    <path class="vis" d="M320 282.5 V254.1 H440 V282.5"/>
    <path class="hid" d="M350 254.1 V324.1 H410 V254.1"/>
    <path class="hidt" d="M347 254.1 V311.1 M413 254.1 V311.1"/>

    <!-- P3 (seviye 1, görünür) — P2 (seviye 2) tam altında, gizli -->
    <path class="vis" d="M237.2 374 H216.5 V466 H237.2"/>
    <path class="hid" d="M216.5 397 H281.5 V443 H216.5"/>
    <path class="hidt" d="M216.5 394 H269.5 M216.5 446 H269.5"/>

    <!-- ØD gövde -->
    <line class="dima" x1="273.9" y1="313.9" x2="486.1" y2="526.1"/>
    <polyline class="dim" points="486.1,526.1 520,560 645,560"/>
    <text class="tb" x="524" y="553">Gövde <tspan class="q">ØD</tspan></text>
    <text class="ts" x="524" y="577">conta oturma yüzeyi</text>

    <!-- üst diş -->
    <polyline class="lead" points="464.5,335.5 515,285 640,285"/>
    <text class="tb" x="519" y="278">1 1/2" DIŞ DİŞ</text>
    <text class="ts" x="519" y="302">üst uç · klingerit conta</text>

    <!-- ØE delik -->
    <polyline class="lead" points="339.9,506.1 300,640 160,640"/>
    <text class="tb" x="162" y="633"><tspan class="q">ØE</tspan> DELİK</text>
    <text class="ts" x="162" y="657">boydan boya (boru gibi)</text>

    <!-- A: merkez – P1 alın -->
    <line class="dim" x1="444" y1="254.1" x2="677" y2="254.1"/>
    <line class="dima" x1="665" y1="254.1" x2="665" y2="420"/>
    <text class="tb q" transform="translate(657 345) rotate(-90)" text-anchor="middle">A</text>

    <!-- B: merkez – P2/P3 alın -->
    <line class="dim" x1="216.5" y1="370" x2="216.5" y2="168"/>
    <line class="dima" x1="216.5" y1="180" x2="380" y2="180"/>
    <text class="tb q" x="298" y="173" text-anchor="middle">B</text>

    <!-- port etiketleri -->
    <polyline class="lead" points="425,254.1 470,150 640,150"/>
    <text class="tb" x="474" y="143">P1 · 3/4" İÇ DİŞ</text>
    <text class="t" x="474" y="168">Seviye 1</text>

    <polyline class="lead" points="216.5,455 200,520 -5,520"/>
    <text class="tb" x="-4" y="513">P3 + P2 · 1/2" İÇ DİŞ</text>
    <text class="tn" x="-4" y="540">P3: Seviye 1 (üstte)</text>
    <text class="tn" x="-4" y="559">P2: Seviye 2 (altta, gizli)</text>

    <text class="h" x="380" y="770" text-anchor="middle">ÜSTTEN GÖRÜNÜM</text>
    <text class="ts" x="380" y="790" text-anchor="middle">ölçeksiz · taslak</text>
  </g>

  <!-- ================= YAN GÖRÜNÜM ================= -->
  <g>
    <line class="ctr" x1="1070" y1="60" x2="1070" y2="520"/>
    <line class="ctr" x1="948" y1="215" x2="1227" y2="215"/>
    <line class="ctr" x1="948" y1="335" x2="1262" y2="335"/>

    <!-- üst uç: 1 1/2" dış diş (klingerit conta) -->
    <path class="vis" d="M998 160 V88 L1006 80 H1134 L1142 88 V160"/>
    <path class="thin" d="M1003 84 V160 M1137 84 V160"/>
    <line class="vis" x1="998" y1="152" x2="1142" y2="152"/>
    <!-- gövde -->
    <path class="vis" d="M980 160 H1160 V420 H980 Z"/>
    <!-- alt uç: dış diş (keten + teflon) -->
    <path class="vis" d="M998 420 V492 L1006 500 H1134 L1142 492 V420"/>
    <path class="thin" d="M1003 420 V496 M1137 420 V496"/>
    <line class="vis" x1="998" y1="428" x2="1142" y2="428"/>
    <!-- boydan boya delik -->
    <path class="hid" d="M1013 80 V500 M1127 80 V500"/>

    <!-- P3 (sol, seviye 1) -->
    <path class="vis" d="M980 187.4 H971.9 V242.6 H980"/>
    <path class="hid" d="M971.9 201.2 H1010.9 V228.8 H971.9"/>

    <!-- P2 (sol, seviye 2) -->
    <path class="vis" d="M980 307.4 H971.9 V362.6 H980"/>
    <path class="hid" d="M971.9 321.2 H1010.9 V348.8 H971.9"/>

    <!-- P1 (arkada, gizli) — seviye 1 -->
    <circle class="hid" cx="1070" cy="215" r="36"/>
    <text class="ts" x="1070" y="272" text-anchor="middle">P1 (arkada)</text>

    <!-- ölçüler -->
    <line class="dim" x1="1146" y1="80" x2="1302" y2="80"/>
    <line class="dim" x1="1164" y1="160" x2="1262" y2="160"/>
    <line class="dim" x1="1164" y1="420" x2="1227" y2="420"/>
    <line class="dim" x1="1146" y1="500" x2="1302" y2="500"/>
    <line class="dima" x1="1215" y1="80" x2="1215" y2="160"/>
    <text class="tb q" transform="translate(1207 120) rotate(-90)" text-anchor="middle">L1</text>
    <line class="dima" x1="1215" y1="160" x2="1215" y2="215"/>
    <text class="tb q" transform="translate(1207 188) rotate(-90)" text-anchor="middle">H1</text>
    <line class="dima" x1="1215" y1="420" x2="1215" y2="500"/>
    <text class="tb q" transform="translate(1207 460) rotate(-90)" text-anchor="middle">L2</text>
    <line class="dima" x1="1250" y1="160" x2="1250" y2="335"/>
    <text class="tb q" transform="translate(1242 248) rotate(-90)" text-anchor="middle">H2</text>
    <line class="dima" x1="1290" y1="80" x2="1290" y2="500"/>
    <text class="tb q" transform="translate(1282 290) rotate(-90)" text-anchor="middle">H</text>

    <!-- etiketler -->
    <polyline class="lead" points="998,118 978,118"/>
    <text class="tb" x="972" y="113" text-anchor="end">1 1/2" DIŞ DİŞ</text>
    <text class="ts" x="972" y="132" text-anchor="end">klingerit conta</text>
    <polyline class="lead" points="998,462 978,462"/>
    <text class="tb" x="972" y="457" text-anchor="end">1 1/2" DIŞ DİŞ <tspan class="q">(?)</tspan></text>
    <text class="ts" x="972" y="476" text-anchor="end">keten + teflon</text>
    <text class="tb" x="944" y="209" text-anchor="end">P3 · 1/2"</text>
    <text class="t" x="944" y="229" text-anchor="end">Seviye 1</text>
    <text class="tb" x="944" y="329" text-anchor="end">P2 · 1/2"</text>
    <text class="t" x="944" y="349" text-anchor="end">Seviye 2</text>

    <text class="h" x="1070" y="545" text-anchor="middle">YAN GÖRÜNÜM</text>
    <text class="ts" x="1070" y="565" text-anchor="middle">boş taraftan (180°) bakış · ölçeksiz</text>
  </g>

  <!-- ================= PORT LİSTESİ ================= -->
  <g>
    <text class="tb" x="780" y="592">PORT LİSTESİ</text>
    <rect x="780" y="600" width="580" height="26" fill="#eee"/>
    <rect x="780" y="600" width="580" height="156" class="grid"/>
    <path class="grid" d="M780 626 H1360 M780 652 H1360 M780 678 H1360 M780 704 H1360 M780 730 H1360"/>
    <path class="grid" d="M850 600 V756 M930 600 V756 M1010 600 V756 M1110 600 V756 M1180 600 V756 M1270 600 V756"/>
    <g class="tb" font-size="13">
      <text x="790" y="618">Port</text><text x="860" y="618">Ölçü</text><text x="940" y="618">Tip</text>
      <text x="1020" y="618">Yön</text><text x="1120" y="618">Seviye</text>
      <text x="1190" y="618">Boss Ø</text><text x="1280" y="618">Diş boyu</text>
    </g>
    <g class="tn">
      <text x="790" y="644" font-weight="700">P1</text><text x="860" y="644">3/4"</text><text x="940" y="644">İç diş</text>
      <text x="1020" y="644">0° · üst</text><text x="1120" y="644">1</text>
      <text x="1190" y="644" class="q">?</text><text x="1280" y="644" class="q">?</text>

      <text x="790" y="670" font-weight="700">P2</text><text x="860" y="670">1/2"</text><text x="940" y="670">İç diş</text>
      <text x="1020" y="670">90° · sol</text><text x="1120" y="670">2</text>
      <text x="1190" y="670" class="q">?</text><text x="1280" y="670" class="q">?</text>

      <text x="790" y="696" font-weight="700">P3</text><text x="860" y="696">1/2"</text><text x="940" y="696">İç diş</text>
      <text x="1020" y="696">90° · sol</text><text x="1120" y="696">1</text>
      <text x="1190" y="696" class="q">?</text><text x="1280" y="696" class="q">?</text>

      <text x="790" y="722" font-weight="700">Üst uç</text><text x="860" y="722">1 1/2"</text><text x="940" y="722">Dış diş</text>
      <text x="1020" y="722">conta</text><text x="1120" y="722">—</text>
      <text x="1190" y="722">—</text><text x="1280" y="722" class="q">L1 ?</text>

      <text x="790" y="748" font-weight="700">Alt uç</text><text x="860" y="748">1 1/2" <tspan class="q">?</tspan></text><text x="940" y="748">Dış diş</text>
      <text x="1020" y="748">keten/teflon</text><text x="1120" y="748">—</text>
      <text x="1190" y="748">—</text><text x="1280" y="748" class="q">L2 ?</text>
    </g>
  </g>

  <!-- ================= NOTLAR ================= -->
  <g>
    <text class="tb" x="40" y="832">NOTLAR</text>
    <text class="tn" x="40" y="854">1. Ölçüler henüz yok: harfli ölçüler (ØD, ØE, A, B, H, H1, H2, L1, L2) ve turuncu "?" alanlar doldurulacak.</text>
    <text class="tn" x="40" y="874">2. Üst uç (seviye 1 tarafı) klingerit conta ile sızdırmaz; conta oturma yüzeyi düz ve çapaksız olacak.</text>
    <text class="tn" x="40" y="894">3. Alt uç keten + teflon ile sızdırmaz. Diş tipi (G paralel / R konik) teyit edilecek.</text>
    <text class="tn" x="40" y="914">4. Gövde boydan boya delik (boru gibi); portlar iç kanallarla bu deliğe açılır.</text>
    <text class="tn" x="40" y="934">5. P1 0°'de; P2 ve P3 90°'de üst üste. Eksenler gövde ekseninde kesişir. Toplam boy mümkün olan en kısa.</text>
    <text class="tn" x="40" y="954">6. Keskin kenarlar 0,3–0,5 × 45° kırılacak. Malzeme: CW614N (CuZn39Pb3) otomat pirinci.</text>
  </g>

  <!-- ================= ANTET ================= -->
  <g>
    <rect x="780" y="780" width="580" height="175" class="grid" stroke-width="1.6"/>
    <path class="grid" d="M780 830 H1360 M780 872 H1360 M780 914 H1360"/>
    <path class="grid" d="M980 830 V914 M1180 830 V914"/>
    <text x="795" y="814" font-size="22" font-weight="700" fill="#111" letter-spacing=".5">KAZAN ALTI PARÇASI</text>
    <text class="ts" x="1345" y="814" text-anchor="end">Teknik resim · taslak</text>

    <text class="tl" x="790" y="845">MALZEME</text><text class="tb" x="790" y="864">Pirinç CW614N</text>
    <text class="tl" x="990" y="845">ÖLÇEK</text><text class="tb" x="990" y="864">Ölçeksiz</text>
    <text class="tl" x="1190" y="845">BİRİM</text><text class="tb" x="1190" y="864">mm</text>

    <text class="tl" x="790" y="887">REVİZYON</text><text class="tb" x="790" y="906">E — Taslak</text>
    <text class="tl" x="990" y="887">TARİH</text><text class="tb" x="990" y="906">29.10.2026</text>
    <text class="tl" x="1190" y="887">DURUM</text><text class="tb q" x="1190" y="906">Ölçü bekliyor</text>

    <text class="tl" x="790" y="929">REV E</text>
    <text class="t" x="790" y="947">Port çıkıntıları %50 daha kısaltıldı (Rev D %30, Rev C %30).</text>
  </g>
</svg>
