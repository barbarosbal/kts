.8,245.0 1178.2,245.0 1176.1,243.9 1174.0,242.7 1171.9,241.4 1150.1,203.6 1150.0,201.2 1150.0,198.8 1150.1,196.4 1171.9,158.6 1174.0,157.3 1176.1,156.1 1178.2,155.0 1221.8,155.0 1223.9,156.1 1226.0,157.3 1228.1,158.6 1249.9,196.4 1250.0,198.8 1250.0,201.2 1249.9,203.6" class="part" style="fill:url(#hatch)"/><circle cx="1200" cy="200" r="50" fill="none" stroke="#67737c" stroke-dasharray="5 4"/><text x="1200" y="120" class="t" text-anchor="middle">KESİT A-A</text><text x="1200" y="279" class="s" text-anchor="middle">SW9 / köşe zarfı Ø10</text><rect x="745" y="382" width="590" height="275" rx="5" fill="#f7fafc" stroke="#d7e0e6"/><text x="765" y="409" class="t" text-anchor="start">DETAY B - tek tırnağın en yönündeki dip geçişi</text><path d="M820 458 L836 458 A32 22 0 0 0 868 480 L948 480 L948 590 L868 590 A32 22 0 0 0 836 612 L820 612 Z" class="part" style="fill:url(#hatch)"/><text x="1015" y="468" class="t" text-anchor="start">Dip R2</text><line class="ext" x1="1004" y1="473" x2="845.6" y2="469"/><text x="1015" y="501" class="s" text-anchor="start">Kök eni 14 → çalışma eni 10</text><text x="1015" y="527" class="s" text-anchor="start">2 mm geçiş, düz bölgenin gerisinde.</text><text x="1015" y="557" class="s" text-anchor="start">A = 23 ağza malzeme eklenmedi.</text><text x="765" y="637" class="s" text-anchor="start">Y-Z kesiti: standart R2 silindirik geçiş; serbest yüzey yok.</text><rect x="835" y="720" width="520" height="73" fill="white" stroke="#d7e0e6"/><text x="852" y="745" class="t" text-anchor="start">REV J | 17.11.2026 | ISO 2768-m | ÖLÇEKSİZ</text><text x="852" y="770" class="s" text-anchor="start">STEP ile tutarlı; yaklaşık ağırlık 130,81 g.</text><text x="45" y="792" class="t" text-anchor="start">NOTLAR</text><text x="45" y="814" class="s" text-anchor="start">1. Ölçüler STEP ile tutarlıdır. Rev J fiziksel uyum ve tork testi tamamlanmış bir ürün değildir.</text><text x="45" y="832" class="s" text-anchor="start">2. C45E+QT / 1.1191: hazır ıslahlı stok. Rp0,2 ≥430 MPa; teslim özellikleri teklif yanıtında.</text><text x="45" y="850" class="s" text-anchor="start">3. Gövde Ø34; sap SW9 x 30, zarf Ø10 +0/-0,05. 10/13 mm mandrende numune kontrolü gerekir.</text><text x="45" y="868" class="s" text-anchor="start">4. 71 mm toplam boy ve 10 x 3,5 x 20 mm düz çalışma uçları Rev I ile aynıdır.</text><text x="45" y="886" class="s" text-anchor="start">5. Alın/cep referansı 2 mm geriye alındı; omuz, cep oturması ve çevre açıklığı kontrol edilir.</text><text x="45" y="904" class="s" text-anchor="start">6. Sap ucu düz: yalnız çapak giderme ≤0,2. Diğer keskin kenarlar 0,3 x 45; kritik ölçü bozulmasın.</text><text x="45" y="922" class="s" text-anchor="start">7. Ratel 0,03-0,05 mm LAZER KAZIMA; boya/koyu markalama yok; ayrı resim ve DXF esastır.</text><text x="45" y="940" class="s" text-anchor="start">8. Çalışma torku onaylanmadı. Darbesiz kullanım; eski ≈24 N.m notu bu revizyon için kullanılmaz.</text></svg>