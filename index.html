<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KTS · Ratel Systems</title>
  <meta name="description" content="Pirinç kazan altı parçası ve oynar rekor: 360° döndürülebilir 3D model ve teknik çizim.">
  <meta name="theme-color" content="#101216">
  <link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
  <link rel="stylesheet" href="style.css?v=bb6dacbe">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.8/build/index.module.js",
      "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.18/build/index.module.js",
      "kts/ortak": "./ortak.js?v=bb6dacbe",
      "kts/kazan": "./model-kazan.js?v=bb6dacbe",
      "kts/rekor": "./model-rekor.js?v=bb6dacbe",
      "kts/montaj": "./model-montaj.js?v=bb6dacbe"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <section id="stage" aria-label="3D model">
      <header class="title">
        <a class="brand" href="https://ratel.systems" target="_blank" rel="noopener">
          <img src="brand/ratel-lockup-dark.svg" alt="Ratel Systems" width="127" height="22">
        </a>
        <h1 id="model-ad">&nbsp;</h1>
        <p id="model-alt">&nbsp;</p>
        <div class="actions">
          <details id="models" class="models">
            <summary>Modeller</summary>
            <nav aria-label="Modeller">
              <a href="?model=kazan" data-model="kazan"><b>Kazan Altı Parçası</b><span>Gövde, üç port</span></a>
              <a href="?model=rekor" data-model="rekor"><b>Oynar Rekor</b><span>Altıgen bilezik, kesik yaka</span></a>
              <a href="?model=montaj" data-model="montaj"><b>Montaj</b><span>Rekor + kazan altı parçası</span></a>
            </nav>
          </details>
          <a id="pkg" class="pkg" href="uretim/" hidden>Üretim paketi →</a>
        </div>
      </header>

      <div class="toolbar">
        <div class="views" role="group" aria-label="Görünüm">
          <button data-view="iso" class="on">İzo</button>
          <button data-view="front">Ön</button>
          <button data-view="top">Üst</button>
          <button data-view="bottom">Alt</button>
        </div>
        <button id="split" class="switch" role="switch" aria-checked="false" title="Parçaları ayır (A)">
          <span class="track"><span class="thumb"></span></span>
          <span>Ayrık</span>
        </button>
        <button id="tech" class="switch" role="switch" aria-checked="false" title="Teknik çizim (T)">
          <span class="track"><span class="thumb"></span></span>
          <span>Teknik çizim</span>
        </button>
      </div>

      <p class="hint">Sürükleyerek 360° döndür · tekerlek / iki parmak ile yakınlaştır</p>
      <div id="loading">Model hazırlanıyor…</div>
    </section>

    <aside id="sheet" aria-label="Teknik çizim" aria-hidden="true">
      <div class="sheet-bar">
        <strong id="sheet-rev">Teknik çizim</strong>
        <a id="sheet-open" target="_blank" rel="noopener">Yeni sekmede aç ↗</a>
      </div>
      <div class="sheet-body">
        <a id="sheet-link" target="_blank" rel="noopener" title="Büyütmek için tıkla">
          <img id="sheet-img" alt="Teknik çizim" loading="lazy">
        </a>
      </div>
    </aside>
  </main>
  <script type="module" src="app.js?v=bb6dacbe"></script>
</body>
</html>
