<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kazan Altı Parçası · KTS</title>
  <meta name="description" content="Pirinç kazan altı parçası: 360° döndürülebilir 3D model ve teknik çizim.">
  <meta name="theme-color" content="#101216">
  <link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
  <link rel="stylesheet" href="style.css?v=94fbeee9">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.8/build/index.module.js",
      "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.18/build/index.module.js"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <section id="stage" aria-label="3D model">
      <header class="title">
        <a class="brand" href="https://ratel.systems" target="_blank" rel="noopener">
          <img src="brand/ratel-lockup-dark.svg" alt="Ratel Systems" width="127" height="22">
        </a>
        <h1>Kazan Altı Parçası</h1>
        <p>Pirinç CW511L · CNC · Rev G taslak</p>
        <a class="pkg" href="uretim/">Üretim paketi →</a>
      </header>

      <div class="toolbar">
        <div class="views" role="group" aria-label="Görünüm">
          <button data-view="iso" class="on">İzo</button>
          <button data-view="front">Ön</button>
          <button data-view="top">Üst</button>
          <button data-view="bottom">Alt</button>
        </div>
        <button id="tech" class="switch" role="switch" aria-checked="false" title="Teknik çizim (T)">
          <span class="track"><span class="thumb"></span></span>
          <span>Teknik çizim</span>
        </button>
      </div>

      <p class="hint">Sürükleyerek 360° döndür · tekerlek / iki parmak ile yakınlaştır</p>
      <div id="loading">Model hazırlanıyor…</div>
    </section>

    <aside id="sheet" aria-label="Teknik çizim" aria-hidden="true">
      <div class="sheet-bar">
        <strong>Teknik çizim · Rev G</strong>
        <a href="kazan-alti-parcasi-taslak.svg?v=94fbeee9" target="_blank" rel="noopener">Yeni sekmede aç ↗</a>
      </div>
      <div class="sheet-body">
        <a href="kazan-alti-parcasi-taslak.svg?v=94fbeee9" target="_blank" rel="noopener" title="Büyütmek için tıkla">
          <img src="kazan-alti-parcasi-taslak.svg?v=94fbeee9" alt="Kazan altı parçası teknik çizimi: üstten ve yan görünüm, port listesi, notlar" loading="lazy">
        </a>
      </div>
    </aside>
  </main>
  <script type="module" src="app.js?v=94fbeee9"></script>
</body>
</html>
