  <g>
    <text class="tb" x="780" y="414">İŞLEME SIRASI</text>
    <text class="tn" x="780" y="436">1. Torna: sap Ø10 × 40, boyun Ø9,5, halka Ø13, gövde Ø32, ön kanal.</text>
    <text class="tn" x="780" y="456">2. Torna: alın yuvası Ø21, orta cep Ø15 × 7, delik Ø4.</text>
    <text class="tn" x="780" y="476">3. Freze (bölücülü): 2 açık ve 2 kilit kanalı, 90° aralıklı; altıgen SW 8,7 × 20.</text>
    <text class="tn" x="780" y="496">4. Freze: iki tırnak 10 × 3,5, dış düz yüzler 30, uç pahları.</text>
    <text class="tn" x="780" y="516">5. Isıl işlem: su verme + temperleme, 44–48 HRC. Yüzey: kumlama + siyah oksit.</text>
    <text class="tn" x="780" y="536">6. Deneme: SDS-Plus ve üç ayaklı mandrende oturma, sonra gerçek kelepçede tork testi.</text>
    <text class="tb q" x="780" y="584">ÜRETİMDEN ÖNCE DOĞRULANACAK</text>
    <text class="tn" x="780" y="606">1. SDS kanal ölçüleri gerçek bir SDS-Plus uçtan ölçülecek; altıgenli sap SDS mandrende denenecek.</text>
    <text class="tn" x="780" y="626">2. Tırnaklar kelepçede nereye oturuyor: karşılıklı iki nokta mı, kaç mm genişlik?</text>
    <text class="tn" x="780" y="646">3. Tırnak boyu C ve eni V (şimdilik 16 × 10).</text>
    <text class="tn" x="780" y="666">4. Orta cep Ø15 × 7 kelepçenin ortasındaki parçayı alıyor mu?</text>
    <text class="tn" x="780" y="686">5. Gereken sıkma torku (N·m).</text>
  </g>

  <g>
    <text class="tb" x="40" y="832">NOTLAR</text>
    <text class="tn" x="40" y="854">1. Taslak: turuncu ölçüler varsayımdır, gerçek kelepçe ölçülmeden üretime verilmez. Çizim orantılıdır, değerler esastır.</text>
    <text class="tn" x="40" y="871">2. Genel tolerans ISO 2768-m. Ağız açıklığı A en az 23: +0,50 / 0.</text>
    <text class="tn" x="40" y="888">3. Sap SDS-Plus: Ø10 × 40, 2 açık + 2 kilit kanalı. Kanal ölçüleri gerçek bir SDS-Plus uçtan alınır, mandrende denenir.</text>
    <text class="tn" x="40" y="905">4. Gövde ile sap ekseni arasında salgı en çok 0,10. Malzeme: 42CrMo4 (1.7225) ıslah çeliği.</text>
    <text class="tn" x="40" y="922">5. Sertlik 44–48 HRC, yüzey kumlama + siyah oksit. Keskin kenarlar 0,3 × 45°.</text>
    <text class="tn" x="40" y="939">6. SDS-Plus matkapta darbe kapalı kullanılır. Altıgen köşeleri Ø10 içinde kalır, sap SDS mandrene girer.</text>
    <text class="tn" x="40" y="956">7. Üç ayaklı mandrende uç halkaya dayanana kadar sürülür, çeneler altıgene oturur. 1/4″ altıgen mandrene girmez.</text>
  </g>

