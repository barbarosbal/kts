  <g>
    <text class="tb" x="780" y="414">İŞLEME SIRASI</text>
    <text class="tn" x="780" y="436">1. Torna: gövde Ø22, geçiş, Ø7,2 sap, bilye kanalı.</text>
    <text class="tn" x="780" y="456">2. Freze (bölücülü): altıgenin 6 yüzeyi, SW 6,35 × 25.</text>
    <text class="tn" x="780" y="476">3. Freze: çatal kanalı 13 × 14, dip köşe R 1,5, ağız pahı 1 × 45°.</text>
    <text class="tn" x="780" y="496">4. Isıl işlem: su verme + temperleme, 44–48 HRC.</text>
    <text class="tn" x="780" y="516">5. Yüzey: siyah oksit. Altıgen ve çatal ölçüsü işlem sonrası kontrol edilir.</text>
    <text class="tn" x="780" y="536">6. Deneme: vidalama mandreninde kilitlenme, sonra gerçek kelepçede tork testi.</text>
    <text class="tb q" x="780" y="584">ÜRETİMDEN ÖNCE DOĞRULANACAK</text>
    <text class="tn" x="780" y="606">1. Kelepçe mekanizması: çatal kulakları döndürüyor mu, sıkma vida / somundan mı?</text>
    <text class="tn" x="780" y="626">2. Çatal açıklığı A ve derinliği C (şimdilik 13 × 14).</text>
    <text class="tn" x="780" y="646">3. Gereken sıkma torku (N·m).</text>
    <text class="tn" x="780" y="666">4. Gövde Ø22 ve boy 65 kelepçenin çevresine sığıyor mu?</text>
  </g>

  <g>
    <text class="tb" x="40" y="832">NOTLAR</text>
    <text class="tn" x="40" y="854">1. Taslak: turuncu ölçüler varsayımdır, gerçek kelepçe ölçülmeden üretime verilmez. Çizim orantılıdır, değerler esastır.</text>
    <text class="tn" x="40" y="871">2. Genel tolerans ISO 2768-m. Altıgen SW 6,35 +0 / −0,10. Çatal açıklığı A +0,20 / +0,05.</text>
    <text class="tn" x="40" y="888">3. Sap ISO 1173 E 6.3 (1/4″) uyumlu olacak. Kanal konumu ve çapı ön değerdir, gerçek bir E 6.3 bite göre kontrol edilir.</text>
    <text class="tn" x="40" y="905">4. Gövde ile altıgen ekseni arasında salgı en çok 0,10. Malzeme: 42CrMo4 (1.7225) ıslah çeliği.</text>
    <text class="tn" x="40" y="922">5. Sertlik 44–48 HRC, yüzey siyah oksit. Keskin kenarlar 0,3 × 45°.</text>
    <text class="tn" x="40" y="939">6. En zayıf kesit Ø4,8 kanal boynu, akma torku yaklaşık 15 N·m. Tork ayarlı kullanılır, darbeli vidalamaya uygun değildir.</text>
  </g>

