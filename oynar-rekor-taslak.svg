    <text class="tb" x="1050" y="704">BİLEZİK · MARKALI YÜZ</text>
    <text class="ts" x="1050" y="724">Bahr logosu · lazer markalama · yükseklik 8</text>
    <text class="ts" x="1050" y="741">altıgenin herhangi bir yüzünde ortalı</text>
    <text class="ts" x="1050" y="758">alt kenarı alt alından 11,5 · düz yüz</text>
  </g>

  <g>
    <text class="tb" x="40" y="802">NOTLAR</text>
    <text class="tn" x="40" y="822">1. Ölçüler onaylıdır. Kesit orantılı çizildi; değerler esastır.</text>
    <text class="tn" x="40" y="839">2. Genel tolerans ISO 2768-m. Kritik: ØD 59 0/−0,2, ØW 55 +0,2/0, ØG 68 +0,3/0, F 46 0/−0,2, T 6 0/−0,1, merkezleme 0/−0,1.</text>
    <text class="tn" x="40" y="856">3. Üst uç R 1 1/2 (ISO 7-1, konik 1:16), keten + teflon. Bilezik G 1 1/2 (ISO 228-1), Parça 1 üst dişine oturur.</text>
    <text class="tn" x="40" y="873">4. Sızdırmazlık: conta merkezlemeye oturur, merkezleme Ø39,5 Parça 1 deliğine 3 mm girer; bilezik her açıda aynı sıkar.</text>
    <text class="tn" x="40" y="890">5. Yaka alt pahı 2 × 45° ve ağız üst pahı 4 × 45° sökme için gereklidir. Yaka üst pahı 0,5 geçilmez: tırnak buraya basar.</text>
    <text class="tn" x="40" y="907">6. Gövde, bilezik takılmadan yaka kesiklerinden SW 46 anahtarla sıkılır. Conta alnı düz, Ra 1,6. Keskin kenarlar 0,3–0,5 × 45°.</text>
    <text class="tn" x="40" y="924">7. Bilezik 70 Nm ile sıkılır, 80 Nm geçilmez.</text>
    <text class="tn" x="40" y="941">8. Malzeme: CW511L (CuZn38As) düşük kurşunlu, çinko kaybına dayanıklı pirinç, EN 10204 3.1 sertifikalı.</text>
    <text class="tn" x="40" y="958">9. Marka: Bahr logosu, lazer markalama; bileziğin bir altıgen yüzünde ortalı, yükseklik 8. Bkz. markalı yüz.</text>
  </g>

