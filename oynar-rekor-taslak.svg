  <g>
    <text class="tb" x="40" y="832">NOTLAR</text>
    <text class="tn" x="40" y="854">1. Taslak: ölçüler öneridir, onaydan sonra kesinleşir. Kesit orantılı çizildi; değerler esastır.</text>
    <text class="tn" x="40" y="871">2. Genel tolerans ISO 2768-m. Bilezik boyunda serbest dönmeli; ağız ile yaka arasında çapta en az 0,5 mm boşluk kalır.</text>
    <text class="tn" x="40" y="888">3. Üst uç R 1 1/2 (ISO 7-1, konik 1:16), keten + teflon. Bilezik G 1 1/2 (ISO 228-1), Parça 1 üst dişine oturur.</text>
    <text class="tn" x="40" y="905">4. Montaj: kesikler hizalıyken yaka bilezik ağzından geçer, 90° çevrilince tırnaklar yakaya basar.</text>
    <text class="tn" x="40" y="922">5. Sıkılı konumda kesikler hizaya ±15° yaklaşmamalı. Bilezik ve yakaya işaret vurulur; gerekirse conta kalınlığı değiştirilir.</text>
    <text class="tn" x="40" y="939">6. Gövde, bilezik takılmadan yaka kesiklerinden SW 46 anahtarla sıkılır. Conta alnı düz, Ra 1,6. Keskin kenarlar 0,3–0,5 × 45°.</text>
    <text class="tn" x="40" y="956">7. Malzeme: CW511L (CuZn38As) düşük kurşunlu, çinko kaybına dayanıklı pirinç, EN 10204 3.1 sertifikalı.</text>
  </g>

