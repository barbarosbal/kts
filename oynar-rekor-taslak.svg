  <g>
    <text class="tb" x="780" y="560">SÖKME SIRASI</text>
    <text class="tn" x="780" y="582">1. Bilezik Parça 1 dişinden sökülür; merkezleme Parça 1 deliğinden çıkar, conta düşer.</text>
    <text class="tn" x="780" y="602">2. Bilezik 5 mm yana kaydırılır: yakanın bir ucu ağız içine girer.</text>
    <text class="tn" x="780" y="622">3. Bilezik 18° eğilir, yaka ağızdan sıyrılır.</text>
    <text class="tn" x="780" y="642">4. Bilezik aşağı alınır. Üst diş hiç açılmaz. Takma ters sırayla yapılır.</text>
    <text class="ts" x="780" y="674">Yol simülasyonla denendi: en dar yerde 0,4 mm boşluk. Parça 1 takılıyken bilezik kaymaz.</text>
  </g>

  <g>
    <text class="tb" x="40" y="832">NOTLAR</text>
    <text class="tn" x="40" y="854">1. Ölçüler onaylıdır. Kesit orantılı çizildi; değerler esastır.</text>
    <text class="tn" x="40" y="871">2. Genel tolerans ISO 2768-m. Ağız ØW ile boyun arasındaki boşluk bileziğin sökülmesi içindir, doldurulmaz.</text>
    <text class="tn" x="40" y="888">3. Üst uç R 1 1/2 (ISO 7-1, konik 1:16), keten + teflon. Bilezik G 1 1/2 (ISO 228-1), Parça 1 üst dişine oturur.</text>
    <text class="tn" x="40" y="905">4. Sızdırmazlık: conta merkezlemeye oturur, merkezleme Ø39,5 Parça 1 deliğine 3 mm girer; bilezik her açıda aynı sıkar.</text>
    <text class="tn" x="40" y="922">5. Yaka alt pahı 2 × 45° ve ağız üst pahı 4 × 45° sökme için gereklidir. Yaka üst pahı 0,5 geçilmez: tırnak buraya basar.</text>
    <text class="tn" x="40" y="939">6. Gövde, bilezik takılmadan yaka kesiklerinden SW 46 anahtarla sıkılır. Conta alnı düz, Ra 1,6. Keskin kenarlar 0,3–0,5 × 45°.</text>
    <text class="tn" x="40" y="956">7. Malzeme: CW511L (CuZn38As) düşük kurşunlu, çinko kaybına dayanıklı pirinç, EN 10204 3.1 sertifikalı.</text>
  </g>

