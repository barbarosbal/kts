  <g>
    <text class="tb" x="40" y="832">NOTLAR</text>
    <text class="tn" x="40" y="854">1. Taslak: ölçüler öneridir, onaydan sonra kesinleşir. Kesit orantılı çizildi; değerler esastır.</text>
    <text class="tn" x="40" y="874">2. Genel tolerans ISO 2768-m. Boyun ØN 44 f7, bilezik sırt deliği Ø44,2 H8: bilezik serbest dönmeli.</text>
    <text class="tn" x="40" y="894">3. Üst uç R 1 1/2 (ISO 7-1, konik 1:16), keten + teflon. Bilezik G 1 1/2 (ISO 228-1), Parça 1 üst dişine oturur.</text>
    <text class="tn" x="40" y="914">4. Montaj: bilezik gövdeye conta tarafından geçirilir, tel Ø3 teğet delikten çeltiğe sürülür, delik kapatılır.</text>
    <text class="tn" x="40" y="934">5. Conta alnı düz, çapaksız, Ra 1,6. Keskin kenarlar 0,3–0,5 × 45°.</text>
    <text class="tn" x="40" y="954">6. Malzeme: CW511L (CuZn38As) düşük kurşunlu, çinko kaybına dayanıklı pirinç, EN 10204 3.1 sertifikalı.</text>
  </g>

