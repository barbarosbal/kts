<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 990" width="1400" height="990" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,1.5 L10,5 L0,8.5 z" fill="#111"/>
    </marker>
    <style>
      .vis{fill:none;stroke:#111;stroke-width:2.4;stroke-linejoin:round}
      .thin{fill:none;stroke:#111;stroke-width:1}
      .hid{fill:none;stroke:#111;stroke-width:1.2;stroke-dasharray:7 4}
      .hidt{fill:none;stroke:#111;stroke-width:0.8;stroke-dasharray:7 4}
      .ctr{fill:none;stroke:#555;stroke-width:0.9;stroke-dasharray:22 4 3 4}
      .dim{fill:none;stroke:#111;stroke-width:0.9}
      .dima{fill:none;stroke:#111;stroke-width:0.9;marker-start:url(#arr);marker-end:url(#arr)}
      .lead{fill:none;stroke:#111;stroke-width:0.9;marker-start:url(#arr)}
      .grid{fill:none;stroke:#111;stroke-width:1}
      .t{font-size:14px;fill:#111}
      .tb{font-size:14px;font-weight:700;fill:#111}
      .ts{font-size:12px;fill:#333}
      .tn{font-size:13px;fill:#111}
      .tl{font-size:10px;fill:#555;letter-spacing:.4px}
      .h{font-size:18px;font-weight:700;fill:#111;letter-spacing:.5px}
      .tt{font-size:11px;fill:#111}
      .ttb{font-size:11px;font-weight:700;fill:#111}
      .dis{fill:none;stroke:#111;stroke-width:1.5;stroke-linejoin:miter}
      .disi{fill:none;stroke:#111;stroke-width:.7}
      .q{fill:#c2410c}
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="990" fill="#fff"/>
  <rect x="20" y="20" width="1360" height="950" class="grid" stroke-width="1.6"/>

  <!-- ================= ÜSTTEN GÖRÜNÜM (Ø48 boru ölçeğinde: 1 mm = 6,25 px) ================= -->
  <g transform="translate(100,0)">
    <!-- eksenler -->
    <line class="ctr" x1="150" y1="420" x2="642" y2="420"/>
    <line class="ctr" x1="380" y1="160" x2="380" y2="600"/>

    <!-- gövde = üst diş üstü (Ø48 / 1 1/2"), diş dibi 3/4 ince yay -->
    <circle class="vis" cx="380" cy="420" r="150"/>
    <path class="thin" d="M380 279.8 A140.2 140.2 0 1 0 520.2 420"/>
    <!-- boydan boya delik -->
    <circle class="vis" cx="380" cy="420" r="125"/>

    <!-- P1: 3/4" iç diş (üst) -->
    <path class="vis" d="M274 313.9 V220 H486 V313.9"/>
    <path class="hid" d="M304.2 220 V320.6 M455.8 220 V320.6"/>
    <path class="hidt" d="M297.4 220 V295 M462.6 220 V295"/>

    <!-- P3 (seviye 1, görünür) — P2 (seviye 2) tam altında, gizli -->
    <path class="vis" d="M258.2 332.5 H180 V507.5 H258.2"/>
    <path class="hid" d="M180 361.4 H269.6 M180 478.6 H269.6"/>
    <path class="hidt" d="M180 354.5 H255 M180 485.5 H255"/>

    <!-- ØD -->
    <polyline class="lead" points="521,471.3 560,510 620,510"/>
    <text class="tb" x="564" y="503">Gövde <tspan{{q}}>ØD</tspan></text>
    <text class="ts" x="564" y="527">et {{et}} mm</text>

    <!-- dış diş -->
    <polyline class="lead" points="450,541.4 490,600 620,600"/>
    <text class="tb" x="494" y="593">{{ustDis}} DIŞ DİŞ</text>
    <text class="ts" x="494" y="617">üst uç · alından conta</text>

    <!-- ØE delik -->
    <polyline class="lead" points="317.5,528.3 280,640 140,640"/>
    <text class="tb" x="142" y="633"><tspan{{q}}>ØE</tspan> DELİK</text>
    <text class="ts" x="142" y="657">boydan boya</text>

    <!-- A: eksen – P1 alın -->
    <line class="dim" x1="490" y1="220" x2="642" y2="220"/>
    <line class="dima" x1="630" y1="220" x2="630" y2="420"/>
    <text class="tb{{qc}}" transform="translate(622 320) rotate(-90)" text-anchor="middle">A</text>

    <!-- B: eksen – P2/P3 alın -->
    <line class="dim" x1="180" y1="330" x2="180" y2="168"/>
    <line class="dima" x1="180" y1="180" x2="380" y2="180"/>
    <text class="tb{{qc}}" x="280" y="173" text-anchor="middle">B</text>

    <!-- port etiketleri -->
    <polyline class="lead" points="450,220 490,150 620,150"/>
    <text class="tb" x="494" y="143">P1 · 3/4" İÇ DİŞ</text>
    <text class="t" x="494" y="168">Seviye 1</text>

    <polyline class="lead" points="180,490 150,520 -5,520"/>
    <text class="tb" x="-4" y="540">P3 + P2 · 1/2" İÇ DİŞ</text>
    <text class="tn" x="-4" y="559">P3: Seviye 1 (üstte)</text>
    <text class="tn" x="-4" y="578">P2: Seviye 2 (altta, gizli)</text>

    <text class="h" x="380" y="770" text-anchor="middle">ÜSTTEN GÖRÜNÜM</text>
    <text class="ts" x="380" y="790" text-anchor="middle">ölçeksiz</text>
  </g>

  <!-- ================= ÖLÇÜ TABLOSU (olculer.json) ================= -->
{{OLCU_TABLOSU}}

  <!-- ================= YAN GÖRÜNÜM (1 mm = 4 px) ================= -->
  <g>
    <line class="ctr" x1="1070" y1="50" x2="1070" y2="518"/>
    <line class="ctr" x1="930" y1="226" x2="1257" y2="226"/>
    <line class="ctr" x1="930" y1="354" x2="1287" y2="354"/>

    <!-- gövde konturu: Ø48 boru, P3 ve P2 boss'ları solda; dişler aşağıda ayrı çizilir -->
    <path class="vis" d="M974 418 V410 H942 V298 H974 V282 H942 V170 H974 V150 M1166 150 V418"/>
    <!-- boss–gövde kesişim eğrileri -->
    <path class="vis" d="M974 170 L975 171.8 L978.2 177.5 L983.7 189 L988.1 200.8 L990.6 211.2 L992 226 L990.6 240.8 L988.1 251.2 L983.7 263 L978.2 274.5 L975 280.2 L974 282"/>
    <path class="vis" d="M974 298 L975 299.8 L978.2 305.5 L983.7 317 L988.1 328.8 L990.6 339.2 L992 354 L990.6 368.8 L988.1 379.2 L983.7 391 L978.2 402.5 L975 408.2 L974 410"/>
    <!-- diş sınırları ve dişler (build.mjs üretir) -->
    <line class="vis" x1="974" y1="150" x2="1166" y2="150"/>
    <line class="vis" x1="974" y1="418" x2="1166" y2="418"/>
{{DIS_UST}}
{{DIS_ALT}}
    <!-- boydan boya delik -->
    <path class="hid" d="M990 70 V498 M1150 70 V498"/>
    <!-- P3 / P2 diş delikleri -->
    <path class="hid" d="M942 188.5 H990 M942 263.5 H990 M942 316.5 H990 M942 391.5 H990"/>
    <path class="hidt" d="M942 184.1 H990 M942 267.9 H990 M942 312.1 H990 M942 395.9 H990"/>
    <!-- P1 (arkada, gizli) — seviye 1 -->
    <circle class="hid" cx="1070" cy="226" r="68"/>
    <circle class="hid" cx="1070" cy="226" r="48.5"/>
    <text class="ts" x="1070" y="314" text-anchor="middle">P1 (arkada)</text>

    <!-- ölçüler (H1, H2 üst alından) -->
    <line class="dim" x1="1170" y1="70" x2="1317" y2="70"/>
    <line class="dim" x1="1170" y1="150" x2="1227" y2="150"/>
    <line class="dim" x1="1170" y1="418" x2="1227" y2="418"/>
    <line class="dim" x1="1170" y1="498" x2="1317" y2="498"/>
    <line class="dima" x1="1215" y1="70" x2="1215" y2="150"/>
    <text class="tb{{qc}}" transform="translate(1207 110) rotate(-90)" text-anchor="middle">L1 = {{L1}}</text>
    <line class="dima" x1="1215" y1="418" x2="1215" y2="498"/>
    <text class="tb{{qc}}" transform="translate(1207 458) rotate(-90)" text-anchor="middle">L2 = {{L2}}</text>
    <line class="dima" x1="1245" y1="70" x2="1245" y2="226"/>
    <text class="tb{{qc}}" transform="translate(1237 186) rotate(-90)" text-anchor="middle">H1 = {{H1}}</text>
    <line class="dima" x1="1275" y1="70" x2="1275" y2="354"/>
    <text class="tb{{qc}}" transform="translate(1267 290) rotate(-90)" text-anchor="middle">H2 = {{H2}}</text>
    <line class="dima" x1="1305" y1="70" x2="1305" y2="498"/>
    <text class="tb{{qc}}" transform="translate(1297 284) rotate(-90)" text-anchor="middle">H = {{H}}</text>

    <!-- etiketler -->
    <polyline class="lead" points="974,110 958,110"/>
    <text class="tb" x="952" y="105" text-anchor="end">{{ustDis}} DIŞ DİŞ</text>
    <text class="ts" x="952" y="124" text-anchor="end">klingerit conta (alından)</text>
    <polyline class="lead" points="974,458 958,458"/>
    <text class="tb" x="952" y="453" text-anchor="end">{{altDis}} DIŞ DİŞ</text>
    <text class="ts" x="952" y="472" text-anchor="end">konik 1:16 · keten + teflon</text>
    <text class="tb" x="925" y="220" text-anchor="end">P3 · 1/2"</text>
    <text class="t" x="925" y="240" text-anchor="end">Seviye 1</text>
    <text class="tb" x="925" y="348" text-anchor="end">P2 · 1/2"</text>
    <text class="t" x="925" y="368" text-anchor="end">Seviye 2</text>

    <text class="h" x="1070" y="545" text-anchor="middle">YAN GÖRÜNÜM</text>
    <text class="ts" x="1070" y="565" text-anchor="middle">boş taraftan (180°) bakış · ölçeksiz</text>
  </g>

  <!-- ================= PORT LİSTESİ ================= -->
  <g>
    <text class="tb" x="780" y="592">PORT LİSTESİ</text>
    <rect x="780" y="600" width="580" height="26" fill="#eee"/>
    <rect x="780" y="600" width="580" height="156" class="grid"/>
    <path class="grid" d="M780 626 H1360 M780 652 H1360 M780 678 H1360 M780 704 H1360 M780 730 H1360"/>
    <path class="grid" d="M850 600 V756 M930 600 V756 M1010 600 V756 M1110 600 V756 M1180 600 V756 M1270 600 V756"/>
    <g class="tb" font-size="13">
      <text x="790" y="618">Port</text><text x="860" y="618">Ölçü</text><text x="940" y="618">Tip</text>
      <text x="1020" y="618">Yön</text><text x="1120" y="618">Seviye</text>
      <text x="1190" y="618">Boss Ø</text><text x="1280" y="618">Diş boyu</text>
    </g>
    <g class="tn">
      <text x="790" y="644" font-weight="700">P1</text><text x="860" y="644">3/4"</text><text x="940" y="644">İç diş</text>
      <text x="1020" y="644">0° · üst</text><text x="1120" y="644">1</text>
      <text x="1190" y="644"{{q}}>{{P1_BOSS}}</text><text x="1280" y="644"{{q}}>{{P1_DIS}}</text>

      <text x="790" y="670" font-weight="700">P2</text><text x="860" y="670">1/2"</text><text x="940" y="670">İç diş</text>
      <text x="1020" y="670">90° · sol</text><text x="1120" y="670">2</text>
      <text x="1190" y="670"{{q}}>{{P2_BOSS}}</text><text x="1280" y="670"{{q}}>{{P2_DIS}}</text>

      <text x="790" y="696" font-weight="700">P3</text><text x="860" y="696">1/2"</text><text x="940" y="696">İç diş</text>
      <text x="1020" y="696">90° · sol</text><text x="1120" y="696">1</text>
      <text x="1190" y="696"{{q}}>{{P3_BOSS}}</text><text x="1280" y="696"{{q}}>{{P3_DIS}}</text>

      <text x="790" y="722" font-weight="700">Üst uç</text><text x="860" y="722">{{ustDis}}</text><text x="940" y="722">Dış diş</text>
      <text x="1020" y="722">alın conta</text><text x="1120" y="722">—</text>
      <text x="1190" y="722">—</text><text x="1280" y="722"{{q}}>L1 = {{L1}}</text>

      <text x="790" y="748" font-weight="700">Alt uç</text><text x="860" y="748">{{altDis}}</text><text x="940" y="748">Konik dış</text>
      <text x="1020" y="748">keten/teflon</text><text x="1120" y="748">—</text>
      <text x="1190" y="748">—</text><text x="1280" y="748"{{q}}>L2 = {{L2}}</text>
    </g>
  </g>

  <!-- ================= NOTLAR ================= -->
  <g>
    <text class="tb" x="40" y="832">NOTLAR</text>
    <text class="tn" x="40" y="854">1. Harfli ölçülerin değerleri ölçü tablosundadır{{onDegerNotu}}. Geometri için STEP modeli esastır; resim ölçeksizdir.</text>
    <text class="tn" x="40" y="874">2. Genel tolerans {{genelTolerans}}; gövde et kalınlığı {{et}} mm. Üst alın conta yüzeyidir: düz, çapaksız, Ra 1,6.</text>
    <text class="tn" x="40" y="894">3. Üst uç {{ustDis}} (ISO 228-1). Alt uç {{altDis}} (ISO 7-1, konik 1:16), keten + teflon. Portlar G. Diş çıkışları serbest.</text>
    <text class="tn" x="40" y="914">4. Port diş dibi delikleri ØE deliğine kadar açılır; kesişim çapakları alınacak. Port girişleri 90° havşa.</text>
    <text class="tn" x="40" y="934">5. P1 0°'de; P2 ve P3 90°'de üst üste. Eksenler gövde ekseninde kesişir. Keskin kenarlar 0,3–0,5 × 45°.</text>
    <text class="tn" x="40" y="954">6. Malzeme: {{malzeme}}, EN 10204 3.1 sertifikalı.</text>
  </g>

  <!-- ================= ANTET ================= -->
  <g>
    <rect x="780" y="780" width="580" height="175" class="grid" stroke-width="1.6"/>
    <path class="grid" d="M780 830 H1360 M780 872 H1360 M780 914 H1360"/>
    <path class="grid" d="M980 830 V914 M1180 830 V914"/>
    <text x="795" y="814" font-size="22" font-weight="700" fill="#111" letter-spacing=".5">KAZAN ALTI PARÇASI</text>
    <text class="ts" x="1345" y="814" text-anchor="end">Teknik resim</text>

    <text class="tl" x="790" y="845">MALZEME</text><text class="tb" x="790" y="864">Pirinç {{malzemeKisa}}</text>
    <text class="tl" x="990" y="845">ÖLÇEK</text><text class="tb" x="990" y="864">Ölçeksiz</text>
    <text class="tl" x="1190" y="845">BİRİM</text><text class="tb" x="1190" y="864">mm</text>

    <text class="tl" x="790" y="887">REVİZYON</text><text class="tb" x="790" y="906">{{rev}} — {{revDurum}}</text>
    <text class="tl" x="990" y="887">TARİH</text><text class="tb" x="990" y="906">{{tarih}}</text>
    <text class="tl" x="1190" y="887">DURUM</text><text class="tb{{qc}}" x="1190" y="906">{{durumKisa}}</text>

    <text class="tl" x="790" y="929">REV {{rev}}</text>
    <text class="t" x="790" y="947">{{revNot}}</text>
  </g>
</svg>
